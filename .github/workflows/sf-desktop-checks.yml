name: SF desktop foundation checks

on:
  push:
    branches: ["sf-rebuild"]
  pull_request:
    branches: ["sf-rebuild"]

jobs:
  local-foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile SF desktop modules
        run: python -m compileall -q sf_desktop
      - name: Run local-only foundation tests
        run: python -m pytest -q tests/test_sf_desktop_environment.py tests/test_sf_scope_guard.py tests/test_sf_storage.py tests/test_sf_reporting.py tests/test_sf_advisor.py

  desktop-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt test dependencies
        run: python -m pip install --upgrade pytest "PySide6>=6.10.1,<7"
      - name: Compile desktop modules
        run: python -m compileall -q sf_desktop
      - name: Run headless desktop integration tests
        run: python -m pytest -q tests/test_sf_qt_window.py
