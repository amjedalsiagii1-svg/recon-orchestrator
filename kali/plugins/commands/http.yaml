service: http
port: 80
arabic_name: "خادم ويب (HTTP)"
description: "خدمة الويب - أهم وأخطر خدمة، 70% من الثغرات هنا"
commands:
  basic_recon:
    arabic: "استطلاع أساسي"
    desc: "جمع معلومات عن الخادم قبل الهجوم"
    items:
      - cmd: "curl -I http://{target}"
        desc: "قراءة headers فقط (سريع)"
        output: "Server: lighttpd/1.4.59 - التقنية والإصدار"
        when: "أول أمر - لا يحمل الصفحة كاملة"
      - cmd: "whatweb http://{target}"
        desc: "بصمة شاملة للتقنيات"
        output: "CMS, frameworks, versions, cookies"
        when: "لتحديد ما يدير الموقع"
      - cmd: "nikto -h http://{target}"
        desc: "فحص آلي لثغرات الويب الشائعة"
        output: "ملفات حساسة، إصدارات قديمة، headers مفقودة"
        when: "بعد whatweb - قد يستغرق دقائق"
  directory_bruteforce:
    arabic: "تخمين المسارات"
    desc: "اكتشاف مسارات مخفية (admin, backup, .git)"
    items:
      - cmd: "gobuster dir -u http://{target} -w /usr/share/wordlists/dirb/common.txt"
        desc: "تعداد مسارات بـ 4600 كلمة"
        output: "/admin (Status: 200) - المسارات الموجودة"
        when: "بعد فحص أساسي - يستغرق 1-2 دقيقة"
      - cmd: "feroxbuster -u http://{target} -w /usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt"
        desc: "أسرع وأعمق - 30 ألف كلمة"
        output: "200, 301, 403 - كل حالة لها معنى"
        when: "عندما يكون الوقت متاحاً"
  cms_scan:
    arabic: "فحص CMS"
    desc: "إذا كان الموقع WordPress/Joomla/Drupal"
    items:
      - cmd: "wpscan --url http://{target} --enumerate vp,vt,u"
        desc: "فحص WordPress للثغرات والمستخدمين"
        output: "Plugins with CVEs + usernames"
        when: "إذا ظهر WordPress في whatweb"
      - cmd: "joomscan -u http://{target}"
        desc: "فحص Joomla"
        output: "الإصدار + ثغرات"
        when: "إذا ظهر Joomla"
  ssl_scan:
    arabic: "فحص SSL/TLS"
    desc: "إذا كان HTTPS مفعل - فحص شهادة وتشفير"
    items:
      - cmd: "sslscan {target}:443"
        desc: "فحص سريع لتشفير SSL"
        output: "الإصدارات المدعومة + نقاط الضعف (SSLv3, RC4)"
        when: "إذا وجدت 443 مفتوح"
      - cmd: "testssl.sh {target}"
        desc: "فحص شامل (يستغرق دقائق)"
        output: "Heartbleed, POODLE, weak ciphers"
        when: "للتقرير النهائي"
  vulnerabilities:
    arabic: "فحص الثغرات الآلي"
    items:
      - cmd: "nmap -p80,443 --script http-vuln* {target}"
        desc: "فحص NSE لثغرات ويب معروفة"
        output: "CVE entries if vulnerable"
        when: "لإصدارات قديمة"
