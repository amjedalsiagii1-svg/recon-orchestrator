  p4: 'بروفايلات: سريع، شامل، خفي، UDP، NSE'
  p5: Nuclei/Nikto/Searchsploit/OpenVAS
  p6: عرض خطط + تأكيد EXPLOIT + dry-run
  p7: تقرير HTML + خط زمني + خطة معالجة
