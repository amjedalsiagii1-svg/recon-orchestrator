[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-orchestrator"
version = "0.6.0"
description = "Security ops platform for Termux & Kali — 7 phases, Arabic UI, dry-run only"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "recon-orchestrator contributors"}]
keywords = ["security","recon","pentest","termux","kali","arabic"]
dependencies = [
    "textual>=0.52.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.3",
    "PyYAML>=6.0.1",
    "pydantic>=2.6.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=61.0"]
dev = ["pytest>=8.0.0","pytest-asyncio>=0.23.0"]

[project.scripts]
recon = "ui.cli:main"

[tool.setuptools.packages.find]
include = ["core*","phases*","integrations*","ui*"]
exclude = ["tests*","reports*","data*","logs*"]
