[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-orchestrator"
version = "0.8.0"
description = "SF — Arabic desktop security assessment platform with a modular analysis core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "SF contributors"}]
keywords = ["security", "assessment", "kali", "arabic", "desktop"]
dependencies = [
    "textual>=0.52.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.3",
    "PyYAML>=6.0.1",
    "pydantic>=2.6.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.10.1,<7"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
recon = "ui.cli:main"
sf = "sf_desktop.app:main"

[tool.setuptools.packages.find]
include = ["core*", "phases*", "integrations*", "ui*", "sf_desktop*"]
exclude = ["tests*", "reports*", "data*", "logs*"]
